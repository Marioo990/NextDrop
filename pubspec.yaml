name: event_tracker
description: Aplikacja do śledzenia wydarzeń cyklicznych
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.0

  # Database
  sqflite: ^2.3.0

  # Storage & Files
  path_provider: ^2.1.1
  path: ^1.8.3
  shared_preferences: ^2.2.2

  # Permissions
  permission_handler: ^11.3.0

  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.2

  # Media
  image_picker: ^1.0.7

  # Internationalization
  intl: ^0.20.2  # ✅ POPRAWIONE - była ^0.18.1

  # Utilities
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Localization Generator
  intl_utils: ^2.8.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Generate localization files
  generate: true

# ========================================
# FLUTTER_INTL CONFIGURATION
# ========================================
flutter_intl:
  enabled: true
  class_name: S
  main_locale: pl
  arb_dir: lib/l10n
  output_dir: lib/generated
  use_deferred_loading: false